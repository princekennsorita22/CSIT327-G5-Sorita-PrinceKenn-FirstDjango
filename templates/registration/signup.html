{% extends "base.html" %}

{% block title %}Create Account | CampusConnect{% endblock %}

{% block content %}

<div class="row justify-content-center py-3">
    <div class="col-lg-6 col-md-8">

        <div class="custom-card p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-3"
                     style="width:65px;height:65px;font-size:28px;">
                    <i class="bi bi-person-plus-fill"></i>
                </div>

                <h2 class="page-heading">Join CampusConnect</h2>
                <p class="subtitle">
                    Create your student account and connect with your campus.
                </p>
            </div>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100 mt-2">
                    Create My Account
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="text-center mt-4">
                <span class="subtitle">Already registered?</span>
                <a href="{% url 'login' %}"
                   class="text-primary fw-bold text-decoration-none">
                    Log in
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
